[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2",
    "langchain-ollama>=0.2",
    "langchain-groq>=0.1",
    "langchain-core>=0.3",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "loguru>=0.7",
    "langchain-redis>=0.2.5",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
