[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2",
    "langchain-ollama>=0.2",
    "langchain-groq>=0.1",
    "langchain-core>=0.3",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "loguru>=0.7",
    "langchain-redis>=0.2.5",
    "loki-logger-handler>=1.1.2",
    "langchain-deepseek>=1.1.0",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "dbutils>=3.0",
    "redis>=5.0",
    "qdrant-client>=1.18.0",
    "pandas>=2.0",
    "langchain-community>=0.4.2",
    "ragas>=0.4.3",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-redis>=0.4.1",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
