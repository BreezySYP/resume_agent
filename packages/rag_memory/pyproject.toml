[project]
name = "rag_memory"
version = "0.1.0"
description = "Generic tiered memory engine for LLM agents (short/mid/long-term)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_memory"]
