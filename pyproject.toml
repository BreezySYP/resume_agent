[tool.uv.workspace]
members = [
    "packages/*",
    "src/auth_service",
    "src/dev_agent",
    "src/stock_agent",
    "src/stock_etl",
    "src/stock_dashboard"
]
[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin --cov=packages/shared/src/shared --cov=packages/rag_memory/src/rag_memory --cov=src/stock_agent --cov=src/stock_etl --cov-report=term-missing"
pythonpath = [
    "src",
    "packages/shared/src",
    "packages/rag_memory/src",
    "src/auth_service",
    "src/stock_agent",
    "src/dev_agent",
    "src/stock_etl",
    "src/stock_dashboard",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
