[tool.uv.workspace]
members = [
    "packages/*",
    "src/dev_agent",
    "src/stock_agent",
    "src/stock_etl",
    "src/stock_dashboard"
]
[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.4"]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/shared/src",
    "src/stock_agent",
    "src/dev_agent",
    "src/stock_etl",
    "src/stock_dashboard",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
