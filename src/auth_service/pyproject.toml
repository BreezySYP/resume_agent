[project]
name = "auth_service"
version = "0.1.0"
description = "Standalone auth service: GitHub OAuth login + JWT access token issuance"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[tool.uv.sources]
shared = { workspace = true }
