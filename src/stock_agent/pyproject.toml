[project]
name = "stock_agent"
version = "0.1.0"
description = "A-share stock analysis agent with MySQL + MinIO + Qdrant + Tavily"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "langgraph>=1.2",
    "langgraph-cli[inmem]>=0.1",
    "langchain>=0.3",
    "langchain-tavily>=0.1",
    "langgraph-checkpoint-redis>=0.1",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "pandas>=2.0",
    "requests>=2.31",
    "loguru>=0.7",
    "langsmith>=0.8.5",
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
]

[tool.uv.sources]
shared = { workspace = true }
