requires-python = ">=3.11"
dependencies = [
    "shared",
    "langgraph>=1.2",
    "langgraph-cli[inmem]>=0.1",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-redis>=0.1",
    "langchain-tavily>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph-checkpoint-redis>=0.1",
    "streamlit>=1.35",
    "ragas>=0.1",
    "datasets>=2.0",
    "langsmith>=0.1",
    "pypdf>=4.0",
    "unstructured>=0.14",
