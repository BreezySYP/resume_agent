global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 股票 Agent（你的评估 / LLM 宏观指标）
  - job_name: stock-agent
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8013"]
        labels:
          service: stock-agent

  # 若其它服务也暴露了 /metrics，按同样方式加
  # - job_name: dev-agent
