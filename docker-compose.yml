# ============================================================
# Monorepo Docker Compose
# 构建上下文统一为根目录，shared 包通过 Dockerfile 复制进各容器
# 启动: docker-compose up -d
# 只启动某服务: docker-compose up -d stock-agent redis mysql
# ============================================================

services:

  # ── Agents ────────────────────────────────────────────────

  dev-agent:
    build:
      context: .                          # ← 根目录作为构建上下文
      dockerfile: Dockerfile.dev-agent
    image: monorepo/dev-agent:latest
    ports:
      - "8003:8003"
      - "8501:8501"                       # Streamlit UI
    env_file: ./.env.prod
    environment:
      REDIS_URL:  redis://redis:6379
      MYSQL_URL:  mysql                   # 容器内用服务名
    depends_on:
      redis:
        condition: service_healthy
    networks: [agent-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  stock-agent:
    build:
      context: .                          # ← 根目录作为构建上下文
      dockerfile: Dockerfile.stock-agent
    image: monorepo/stock-agent:latest
    ports:
      - "8004:8004"
    env_file: ./.env.prod
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks: [agent-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Infrastructure ────────────────────────────────────────

  redis:
    container_name: devagent-redis
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [agent-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql:
    container_name: devagent-mysql
    image: mysql:8.0
    command: >
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "3306:3306"
    env_file: ./.env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [agent-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchangeit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    container_name: devagent-minio
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"                       # Web 管理界面
    env_file: ./.env.prod
    volumes:
      - minio_data:/data
    networks: [agent-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Observability ─────────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: devagent-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"                       # OTLP gRPC（agent 发 trace 到这里）
      - "3200:3200"                       # Grafana 查询 trace
    networks: [agent-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devagent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - grafana_data:/var/lib/grafana
      # - ./grafana/provisioning:/etc/grafana/provisioning   # 自动添加 Tempo 数据源（推荐）
      
    networks: [agent-net]
# ── Volumes & Networks ────────────────────────────────────

volumes:
  redis_data:
  mysql_data:
  minio_data:
  grafana_data:

networks:
  agent-net:
    driver: bridge
